services:
  roxy:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      HOST: "0.0.0.0"
      PORT: "4000"
      DEMO_MODE: "${DEMO_MODE:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:4000}"
      DB_PATH: /app/data/roxy.sqlite
    volumes:
      - roxy-data:/app/data
    restart: unless-stopped
volumes:
  roxy-data:
